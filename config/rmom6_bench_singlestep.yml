# ---------------------------------------------------------------------------------------- #
# BENCHMARK config -- single-step (forecast_len 1). Not a training run.
#
# Derived from rmom6_regional_pointwise_multistep_tendency_full.yml, changing ONLY
# forecast_len (and trimming the epoch counts, which scripts/benchmark_rmom6.py ignores --
# it times a fixed --iters). Everything the cost depends on is held at production values:
# the same full-scale 2000-2017 zarr stores, train_batch_size 16, thread_workers 4, the same
# model geometry and the same pre/postblock chains. So s/iter measured here is the s/iter a
# real run pays.
#
#   python -u scripts/benchmark_rmom6.py -c config/rmom6_bench_singlestep.yml --iters 3
#
# Compare the two bench configs to separate per-rollout-step cost from fixed per-iteration
# cost: singlestep consumes 1 dataloader batch per iteration, multistep consumes 10.
# ---------------------------------------------------------------------------------------- #
save_loc: /glade/derecho/scratch/$USER/CREDIT_runs/rmom6_bench_singlestep
seed: 1000
data:
  source:
    rMOM6:
      dataset_type: rmom6
      level_coord: z1_l
      levels: null
      variables:
        prognostic:
          vars_3D:
          - uo
          - vo
          - thetao
          - so
          vars_2D:
          - SSH
          path: /glade/derecho/scratch/ajanney/rmom6_regional/preprocessed/rmom6_prognostic_%Y.zarr
        dynamic_forcing:
          vars_2D:
          - taux
          - tauy
          - net_heat_surface
          - runoff
          path: /glade/derecho/scratch/ajanney/rmom6_regional/preprocessed/rmom6_forcing_%Y.zarr
        static:
          vars_2D:
          - deptho
          - wet
          path: /glade/derecho/scratch/ajanney/archive/carib12_runoff_tides_rmax600_f200_gioGlofas_gioNNSM/ocn/hist/carib12_runoff_tides_rmax600_f200_gioGlofas_gioNNSM.mom6.h.static.nc
  start_datetime: '2000-01-01 12:00:00'
  end_datetime: '2017-12-31 12:00:00'
  timestep: 1d
  history_len: 1
  forecast_len: 1
  valid_history_len: 1
  valid_forecast_len: 1
  one_shot: true
  lead_time_periods: 1
  skip_periods: null
  static_first: true
validation_data:
  source:
    rMOM6:
      dataset_type: rmom6
      level_coord: z1_l
      levels: null
      variables:
        prognostic:
          vars_3D:
          - uo
          - vo
          - thetao
          - so
          vars_2D:
          - SSH
          path: /glade/derecho/scratch/ajanney/rmom6_regional/preprocessed/rmom6_prognostic_%Y.zarr
        dynamic_forcing:
          vars_2D:
          - taux
          - tauy
          - net_heat_surface
          - runoff
          path: /glade/derecho/scratch/ajanney/rmom6_regional/preprocessed/rmom6_forcing_%Y.zarr
        static:
          vars_2D:
          - deptho
          - wet
          path: /glade/derecho/scratch/ajanney/archive/carib12_runoff_tides_rmax600_f200_gioGlofas_gioNNSM/ocn/hist/carib12_runoff_tides_rmax600_f200_gioGlofas_gioNNSM.mom6.h.static.nc
  start_datetime: '2018-01-01 12:00:00'
  end_datetime: '2019-12-20 12:00:00'
  timestep: 1d
  history_len: 1
  forecast_len: 1
  valid_history_len: 1
  valid_forecast_len: 1
  one_shot: true
  lead_time_periods: 1
  skip_periods: null
  static_first: true
preblocks:
  per_step:
    normalize:
      type: pointwise_scaler
      args:
        stats_path: /glade/derecho/scratch/$USER/rmom6_regional/scaler/ocean_pointwise_xi_levelpairs.pt
        variables:
        - rMOM6/prognostic/3d/thetao
        - rMOM6/prognostic/3d/so
        - rMOM6/prognostic/3d/uo
        - rMOM6/prognostic/3d/vo
        - rMOM6/prognostic/2d/SSH
        method: transform
    fill_land:
      type: fill_values
      args:
        variables: []
        rules:
        - search: nan
          fill: 0.0
    concat:
      type: concat
postblocks:
  per_step:
    reconstruct:
      type: reconstruct
    denorm:
      type: pointwise_scaler
      args:
        stats_path: /glade/derecho/scratch/$USER/rmom6_regional/scaler/ocean_pointwise_xi_levelpairs.pt
        variables: []
        method: inverse_transform
    clamp:
      type: ocean_clamp
      args:
        bounds:
          rMOM6/prognostic/3d/so:
          - 0.0
          - 45.0
          rMOM6/prognostic/3d/thetao:
          - -2.0
          - 40.0
          rMOM6/prognostic/3d/uo:
          - -5.0
          - 5.0
          rMOM6/prognostic/3d/vo:
          - -5.0
          - 5.0
          rMOM6/prognostic/2d/SSH:
          - -5.0
          - 5.0
    wet_mask:
      type: ocean_wet_mask
      args:
        static_path: /glade/derecho/scratch/ajanney/archive/carib12_runoff_tides_rmax600_f200_gioGlofas_gioNNSM/ocn/hist/carib12_runoff_tides_rmax600_f200_gioGlofas_gioNNSM.mom6.h.static.nc
        level_source_path: /glade/derecho/scratch/ajanney/rmom6_regional/preprocessed/rmom6_prognostic_2000.zarr
        level_var: z1_l
        levels: null
    obc_nudge:
      type: ocean_obc_nudge
      args:
        obc_paths:
          north: /glade/derecho/scratch/ajanney/rmom6_regional/preprocessed/obc_north.zarr
          south: /glade/derecho/scratch/ajanney/rmom6_regional/preprocessed/obc_south.zarr
          east: /glade/derecho/scratch/ajanney/rmom6_regional/preprocessed/obc_east.zarr
          west: /glade/derecho/scratch/ajanney/rmom6_regional/preprocessed/obc_west.zarr
        variables:
        - rMOM6/prognostic/3d/thetao
        - rMOM6/prognostic/3d/so
        - rMOM6/prognostic/3d/uo
        - rMOM6/prognostic/3d/vo
        - rMOM6/prognostic/2d/SSH
        levels: null
  post_rollout:
    density:
      type: ocean_density
      args:
        theta_var: rMOM6/prognostic/3d/thetao
        salt_var: rMOM6/prognostic/3d/so
        output_var: rMOM6/diagnostic/3d/rho
        enforce_stability: false
trainer:
  type: era5-gen2
  parallelism:
    data: ddp
    tensor: 1
    domain: 1
  activation_checkpoint: true
  load_weights: false
  train_batch_size: 16
  valid_batch_size: 1
  batches_per_epoch: 2
  valid_batches_per_epoch: 2
  thread_workers: 4
  valid_thread_workers: 4
  prefetch_factor: 2
  start_epoch: 0
  num_epoch: 1
  epochs: 1
  learning_rate: 0.001
  weight_decay: 0.0
  amp: false
  grad_accum_every: 1
  grad_max_norm: dynamic
  use_scheduler: true
  scheduler:
    scheduler_type: cosine-annealing
    T_max: 20
    eta_min: 1.0e-06
model:
  type: wxformer
  frames: 1
  image_height: 457
  image_width: 759
  levels: 25
  channels: 4
  surface_channels: 1
  input_only_channels: 6
  output_only_channels: 0
  patch_width: 1
  patch_height: 1
  frame_patch_size: 1
  dim:
  - 32
  - 64
  - 128
  - 256
  depth:
  - 2
  - 2
  - 8
  - 2
  global_window_size:
  - 8
  - 4
  - 2
  - 1
  local_window_size: 4
  cross_embed_kernel_sizes:
  - - 4
    - 8
    - 16
    - 32
  - - 2
    - 4
  - - 2
    - 4
  - - 2
    - 4
  cross_embed_strides:
  - 2
  - 2
  - 2
  - 2
  attn_dropout: 0.0
  ff_dropout: 0.0
  interp: false
  use_spectral_norm: true
  upsample_with_ps: true
  padding_conf:
    activate: true
    mode: mirror
    pad_lat:
    - 28
    - 27
    pad_lon:
    - 5
    - 4
loss:
  training_loss: mse
  validation_loss: mse
  use_power_loss: false
  use_spectral_loss: false
  use_latitude_weights: false
  use_variable_weights: false
inference:
  run_mode: single
  mode: none
  save_forecast: /glade/derecho/scratch/$USER/CREDIT_runs/rmom6_regional_pointwise_multistep_tendency_full/rollout
  single_forecast:
    forecast_length: 14d
    start_datetime: '2000-01-01 12:00:00'
  output:
    format: netcdf
    output_interval: null
    group_by: full
    variables: null
    metadata: null
    encoding:
      dtype: float32
      zlib: true
      complevel: 4
pbs:
  conda: miles-credit-derecho
  project: p93300012
  job_name: rmom6_bench_singlestep
  walltime: 01:00:00
  nodes: 1
  ncpus: 64
  ngpus: 1
  mem: 480GB
  queue: main
