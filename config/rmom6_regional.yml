# ------------------------------------------------------------------------------------------------- #
# Regional MOM6 ocean emulator — CREDIT gen2 config
#
# Demonstrates the migrated ocean pipeline:
#   * data.source.rMOM6            -> credit/datasets/rmom6.py  (RegionalMOM6Dataset)
#   * preblocks                    -> normalize + fill land NaNs + concat
#   * postblocks                   -> reconstruct + denormalize + clamp + wet-mask + density
#
# This config is set up for a 15-day SAMPLE run (2000-01-01..2000-01-15) — enough to
# validate the full pipeline end-to-end before committing to the full 2000-2019 archive.
# Preprocess with scripts/derecho_preprocess_rmom6_sample.sh (or run its 3 commands
# directly), then `credit train -c config/rmom6_regional.yml`.
#
# To go to a full production run afterward:
#   - re-preprocess with scripts/preprocess_rmom6.py (no --start-date/--end-date) for the
#     full year range you want, and change the two `..._sample.zarr` paths below back to
#     the `%Y`-patterned form (e.g. rmom6_prognostic_%Y.zarr) so LocalDataset globs across
#     years; widen start_datetime/end_datetime accordingly.
#   - regenerate the scaler if you changed --levels; the stats themselves don't depend on
#     date range, so scripts/build_rmom6_scaler.py doesn't need to change for the sample.
# ------------------------------------------------------------------------------------------------- #

save_loc: '/glade/derecho/scratch/$USER/CREDIT_runs/rmom6_regional'
seed: 1000


# ---- USER: training data ---- #
data:
  source:
    rMOM6:
      dataset_type: "rmom6"
      level_coord: "z1_l"
      # levels: null  -> use all 50 z1_l layers (preprocess_rmom6.py default). Preprocess
      #                  with --levels to produce a shallower-upper-ocean store instead.
      levels: null
      # No rename needed: the glorys archive already uses canonical names (uo, vo,
      # thetao, so, SSH) directly.
      variables:
        # Prognostic: predicted and fed back as input each step.
        # Produced by scripts/preprocess_rmom6.py (regridded to Arakawa A / cell centers).
        prognostic:
          vars_3D: [ 'uo', 'vo', 'thetao', 'so' ]
          vars_2D: [ 'SSH' ]
          # SAMPLE: single file (no %Y) — LocalDataset treats one matched file as
          # covering the whole time range. Produced by:
          #   scripts/preprocess_rmom6.py --start-date 2000-01-01 --end-date 2000-01-16
          path: '/glade/derecho/scratch/ajanney/rmom6_regional/preprocessed/dev_scale_archive/rmom6_prognostic_sample.zarr'

        # Dynamic forcing: time-varying inputs, never predicted.
        # Produced by scripts/preprocess_rmom6.py from *.atm.YYYY-MM.nc (taux/tauy
        # regridded from tauuo/tauvo; net_heat_surface is hfds and runoff is friver,
        # both already tracer-grid).
        # p_surf/precip are not yet produced — add an entry to FORCING_SPEC in that
        # script when you want them (pso for p_surf; no direct 'precip' field — see
        # wfo/evs candidates in the script's docstring discussion).
        # OBCs are NOT included here yet — scripts/preprocess_obcs.py produces them
        # (obc_north/south/east/west_sample.zarr) but embedding boundary-strip data
        # into full-domain dynamic_forcing is a separate design step, not done here.
        dynamic_forcing:
          vars_2D: [ 'taux', 'tauy', 'net_heat_surface', 'runoff' ]
          path: '/glade/derecho/scratch/ajanney/rmom6_regional/preprocessed/dev_scale_archive/rmom6_forcing_sample.zarr'

        # Static: time-invariant geometry inputs, never predicted.
        static:
          vars_2D: [ 'deptho', 'wet' ]
          path: '/glade/derecho/scratch/ajanney/archive/carib12_runoff_tides_rmax600_f200_gioGlofas_gioNNSM/ocn/hist/carib12_runoff_tides_rmax600_f200_gioGlofas_gioNNSM.mom6.h.static.nc'

  # SAMPLE train window: first 10 of the 15 preprocessed days.
  start_datetime: "2000-01-01 12:00:00"
  end_datetime:   "2000-01-10 12:00:00"
  timestep: "1d"

  history_len: 1
  forecast_len: 1
  valid_history_len: 1
  valid_forecast_len: 1

  one_shot: True
  lead_time_periods: 1
  skip_periods: null
  static_first: True


# ---- USER: validation data (same source name as data: -- required by the bridgescaler
# key path, which is keyed by source name; see config/gen_2/examples for the convention) ---- #
validation_data:
  source:
    rMOM6:
      dataset_type: "rmom6"
      level_coord: "z1_l"
      levels: null
      variables:
        prognostic:
          vars_3D: [ 'uo', 'vo', 'thetao', 'so' ]
          vars_2D: [ 'SSH' ]
          path: '/glade/derecho/scratch/ajanney/rmom6_regional/preprocessed/dev_scale_archive/rmom6_prognostic_sample.zarr'
        dynamic_forcing:
          vars_2D: [ 'taux', 'tauy', 'net_heat_surface', 'runoff' ]
          path: '/glade/derecho/scratch/ajanney/rmom6_regional/preprocessed/dev_scale_archive/rmom6_forcing_sample.zarr'
        static:
          vars_2D: [ 'deptho', 'wet' ]
          path: '/glade/derecho/scratch/ajanney/archive/carib12_runoff_tides_rmax600_f200_gioGlofas_gioNNSM/ocn/hist/carib12_runoff_tides_rmax600_f200_gioGlofas_gioNNSM.mom6.h.static.nc'
  # SAMPLE valid window: last 5 of the 15 preprocessed days.
  start_datetime: "2000-01-11 12:00:00"
  end_datetime:   "2000-01-15 12:00:00"
  timestep: "1d"
  history_len: 1
  forecast_len: 1
  # validation_data must carry every key conf["data"] has (load_dataset rejects partial
  # configs) -- mirror the rest of data:'s settings here rather than omitting them.
  valid_history_len: 1
  valid_forecast_len: 1
  one_shot: True
  lead_time_periods: 1
  skip_periods: null
  static_first: True


# ------------------------------------------------------------------------------------------------- #
# PREBLOCKS — build the model input tensor from the nested per-variable dict.
#   normalize (mean/std) -> fill land NaNs with 0 -> concat to (B, C, H, W)
# ------------------------------------------------------------------------------------------------- #
preblocks:
  per_step:
    normalize:
      type: bridgescaler_transform   # standard scaler == per-variable z-score (mean/std)
      args:
        # Generated by scripts/build_rmom6_scaler.py from explore_statistics_carib12/stats/.
        scaler_path: '/glade/derecho/scratch/$USER/rmom6_regional/scaler/ocean_bridgescaler.json'
        # Explicit, NOT []: stats only cover these 5 prognostic vars. An empty list ([] = "all
        # variables present") would also try to scale dynamic_forcing/static, which have no
        # scaler entry yet, and bridgescaler raises on the first one it hits. Add more entries
        # here only once build_rmom6_scaler.py (or a stats pass over forcing data) covers them.
        variables:
          - "rMOM6/prognostic/3d/thetao"
          - "rMOM6/prognostic/3d/so"
          - "rMOM6/prognostic/3d/uo"
          - "rMOM6/prognostic/3d/vo"
          - "rMOM6/prognostic/2d/SSH"
        method: transform
        scaler_type: standard
    fill_land:
      type: fill_values              # replace land NaNs with 0 after normalization
      args:
        variables: []                # [] = all variables
        rules:
          - { search: "nan", fill: 0.0 }
    concat:
      type: concat


# ------------------------------------------------------------------------------------------------- #
# POSTBLOCKS — split model output back to per-variable dict, return to physical units,
# then apply ocean physics: clamp -> wet-mask -> diagnose density.
#
# NOTE: Reconstruct DETACHES y_processed, so these blocks shape rollout feed-back and
# written outputs, NOT the single-step training gradient (see OCEAN_MIGRATION_NOTES.md).
# ------------------------------------------------------------------------------------------------- #
postblocks:
  per_step:
    reconstruct:
      type: reconstruct
    denorm:
      type: bridgescaler_transform   # inverse of the preblock, SAME scaler file
      args:
        scaler_path: '/glade/derecho/scratch/$USER/rmom6_regional/scaler/ocean_bridgescaler.json'
        # [] is safe here (unlike the preblock): Reconstruct's y_processed only ever
        # holds prognostic/diagnostic vars, never static/dynamic_forcing.
        variables: []
        method: inverse_transform
    clamp:
      type: ocean_clamp              # physical bounds (physical units, so after denorm)
      args:
        bounds:
          "rMOM6/prognostic/3d/so":     [ 0.0,  45.0 ]
          "rMOM6/prognostic/3d/thetao": [ -2.0, 40.0 ]
          "rMOM6/prognostic/3d/uo":     [ -5.0, 5.0 ]
          "rMOM6/prognostic/3d/vo":     [ -5.0, 5.0 ]
          "rMOM6/prognostic/2d/SSH":    [ -5.0, 5.0 ]
    wet_mask:
      type: ocean_wet_mask           # zero land points using static geometry
      args:
        static_path: '/glade/derecho/scratch/ajanney/archive/carib12_runoff_tides_rmax600_f200_gioGlofas_gioNNSM/ocn/hist/carib12_runoff_tides_rmax600_f200_gioGlofas_gioNNSM.mom6.h.static.nc'
        # z1_l layer depths are not in the static file; read them from one preprocessed
        # prognostic store instead (or pass level_depths: [ ... ] explicitly).
        level_source_path: '/glade/derecho/scratch/ajanney/rmom6_regional/preprocessed/dev_scale_archive/rmom6_prognostic_sample.zarr'
        level_var: "z1_l"
        levels: null
  post_rollout:
    density:
      type: ocean_density            # diagnose seawater potential density from theta, S
      args:
        theta_var:  "rMOM6/prognostic/3d/thetao"
        salt_var:   "rMOM6/prognostic/3d/so"
        output_var: "rMOM6/diagnostic/3d/rho"
        enforce_stability: false     # experimental; see notes before enabling


# ---- Training ---- #
trainer:
  type: era5-gen2
  parallelism:
    data: ddp
    tensor: 1
    domain: 1
  activation_checkpoint: True
  load_weights: False

  train_batch_size: 1
  valid_batch_size: 1
  thread_workers: 4
  valid_thread_workers: 4
  prefetch_factor: 2

  start_epoch: 0
  num_epoch: 5
  epochs: 20
  learning_rate: 1.0e-3
  weight_decay: 0.0
  amp: False
  grad_accum_every: 1
  grad_max_norm: 'dynamic'

  use_scheduler: True
  scheduler:
    scheduler_type: cosine-annealing
    T_max: 20
    eta_min: 1.0e-6


# ---- USER: model geometry. TUNE THESE to the regional grid (H=457 yh, W=759 xh). ---- #
# wxformer window/padding sizes must divide the padded spatial dims at each stage.
# The values below are placeholders — validate against a forward pass on the real grid
# (see OCEAN_MIGRATION_NOTES.md, test T5).
model:
  type: "wxformer"
  frames: 1
  image_height: 457
  image_width: 759
  levels: 50                 # match data levels (50 z1_l layers, or your --levels subset count)
  channels: 4                # 3D prognostic vars (uo, vo, thetao, so)
  surface_channels: 1        # 2D prognostic vars (SSH)
  input_only_channels: 6     # dynamic_forcing (4: taux, tauy, net_heat_surface, runoff) + static (2)
  output_only_channels: 0    # diagnostic prognostic targets (none predicted directly)

  patch_width: 1
  patch_height: 1
  frame_patch_size: 1
  dim: [ 32, 64, 128, 256 ]
  depth: [ 2, 2, 8, 2 ]
  global_window_size: [ 8, 4, 2, 1 ]
  local_window_size: 4
  cross_embed_kernel_sizes:
    - [ 4, 8, 16, 32 ]
    - [ 2, 4 ]
    - [ 2, 4 ]
    - [ 2, 4 ]
  cross_embed_strides: [ 2, 2, 2, 2 ]
  attn_dropout: 0.
  ff_dropout: 0.
  interp: False
  use_spectral_norm: True
  upsample_with_ps: True
  padding_conf:
    activate: True
    mode: mirror             # regional (non-periodic) domain -> mirror, not earth/spherical
    # image_height/image_width above are unused for shape (patch=1, interp=False skips both
    # CubeEmbedding and the resize) -- the real constraint is the PADDED H/W surviving 4
    # stride-2 downsamples and still dividing by local_window_size=4 at the last stage, i.e.
    # divisible by 64. 457+55=512=64*8, 759+9=768=64*12. Verified with a real forward pass
    # on this grid (CrossFormer, cuda): output shape (1, 201, 1, 457, 759) as expected.
    pad_lat: [ 28, 27 ]      # sum 55 -> 512
    pad_lon: [ 5, 4 ]        # sum 9  -> 768


# ---- Loss ---- #
loss:
  training_loss: "mse"
  validation_loss: "mse"
  use_power_loss: False
  use_spectral_loss: False
  use_latitude_weights: False    # regional ocean grid; disable global lat weighting
  use_variable_weights: False


# ---- USER: rollout / inference ---- #
# Single 14-step (14d, timestep=1d) forecast starting at the sample's first timestamp, so
# valid times span the full preprocessed 15-day window (2000-01-01 12:00 init -> steps land
# on 2000-01-02..2000-01-15 12:00) without running past the end of the sample forcing store.
inference:
  run_mode: single
  mode: none                     # single GPU, no torchrun/process group needed
  save_forecast: '/glade/derecho/scratch/$USER/CREDIT_runs/rmom6_regional/rollout'

  single_forecast:
    forecast_length: "14d"
    start_datetime: "2000-01-01 12:00:00"

  output:
    format: netcdf
    output_interval: null        # write every step
    group_by: full                # one file for the whole 14-step forecast
    variables: null                # save all predicted variables
    metadata: null                  # no ocean CF-metadata yaml yet (ERA5-specific only)
    encoding:
      dtype: float32
      zlib: true
      complevel: 4


pbs:
  conda: "credit-derecho"
  project: "p93300012"
  job_name: "rmom6_regional_sample"
  walltime: "01:00:00"          # SAMPLE: 15 days of data, short smoke test. Widen for production.
  nodes: 1
  ncpus: 64
  ngpus: 1
  mem: '480GB'
  queue: 'main'
